name: Baseline Extension CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:dependency-patches
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:upstream
      - run: npm run test:http-settings --workspace=@chkp/quantum-infra
      - run: npm run test --workspace=@chkp/checkpoint-waf-mcp
      - run: npm run test --workspace=@chkp/argos-erm-mcp
      - run: npm run test --workspace=@focuslight-nr/checkpoint-gaia-readonly-collector-mcp
      - run: npm run test --workspace=@focuslight-nr/checkpoint-baseline-audit-mcp
      - run: npm run test --workspace=@focuslight-nr/checkpoint-baseline-change-planner-mcp
      - run: npm run test --workspace=@focuslight-nr/checkpoint-baseline-change-executor-mcp
      - run: npm run test --workspace=@focuslight-nr/checkpoint-github-approval-adapter-mcp
      - run: npm run test --workspace=@focuslight-nr/checkpoint-baseline-audit-runner
      - run: npm run build --workspace=@focuslight-nr/checkpoint-gaia-readonly-collector-mcp
      - run: npm run build --workspace=@focuslight-nr/checkpoint-baseline-audit-mcp
      - run: npm run build --workspace=@focuslight-nr/checkpoint-baseline-change-planner-mcp
      - run: npm run build --workspace=@focuslight-nr/checkpoint-baseline-change-executor-mcp
      - run: npm run build --workspace=@focuslight-nr/checkpoint-github-approval-adapter-mcp
      - run: npm run build --workspace=@focuslight-nr/checkpoint-baseline-audit-runner

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse Windows deployment templates
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem packages/baseline-audit-runner/examples/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }
